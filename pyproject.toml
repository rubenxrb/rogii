[project]
name = "rogii"
version = "0.1.0"
description = "Kaggle: ROGII - Wellbore Geology Prediction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=17",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "catboost>=1.2.8",
    "optuna>=4.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
    "tqdm>=4.66",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "kaggle>=1.6",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "nbstripout>=0.8",
    "pre-commit>=4.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
